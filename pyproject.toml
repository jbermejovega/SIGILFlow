[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigilflow"
version = "0.1.0"
description = "Typed flow-kernel library bridging TFG computational sources and SIGILBOOK kernel semantics"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
